  <div id="outer-wrapper">
    <header class="subpage-hero container">
      <div class="section-head-title reveal" data-delay="100">
        <span class="section-head-ghost display" aria-hidden="true" data-i18n="games.library.title">Games</span>
        <h1 class="display" data-i18n="games.library.title">Games</h1>
      </div>
      <p class="sub-desc reveal" data-delay="200" data-i18n="games.library.desc">Original titles from Tier Studios · pick a game to open its page.</p>
    </header>

    <div class="subpage-content container">
      <div class="games-library-bar reveal" data-delay="60">
        <p class="games-library-count label">
          <span data-i18n="games.library.all">All Games</span>
          <span aria-hidden="true">(2)</span>
        </p>
      </div>

      <div class="games-library-grid" data-stagger="80">
        <a href="/games/keep-chaos" class="games-library-card reveal" data-cursor="hover" data-i18n-aria="games.library.kcAria" aria-label="Keep Chaos">
          <span class="games-library-art" aria-hidden="true">
            <img src="/assets/img/game/keep-chaos-library.png" alt="" width="600" height="900" loading="eager" decoding="async" />
          </span>
          <span class="games-library-shade" aria-hidden="true"></span>
          <span class="games-library-logo" aria-hidden="true">
            <img src="/assets/img/game/keep-chaos-logo.svg" alt="" width="280" height="120" />
          </span>
          <span class="games-library-meta">
            <span class="games-library-status label">
              <span class="game-teaser-rec" aria-hidden="true"></span>
              <span data-i18n="index.games.status">On Steam</span>
            </span>
            <span class="display games-library-name">Keep Chaos</span>
          </span>
        </a>

        <div class="games-library-card games-library-card--wip reveal" data-cursor="hover" data-i18n-aria="games.library.wipStatus" aria-label="Actively in development">
          <span class="games-library-art games-library-art--wip" aria-hidden="true">
            <span class="games-library-code-field" id="gamesLibraryWipCode"></span>
            <span class="games-library-mystery">?</span>
          </span>
          <span class="games-library-shade" aria-hidden="true"></span>
          <span class="games-library-meta">
            <span class="games-library-status label">
              <span class="game-teaser-rec" aria-hidden="true"></span>
              <span data-i18n="games.library.wipStatus">Actively in development</span>
            </span>
            <span class="display games-library-name" data-i18n="games.library.wipName">Coming Soon</span>
          </span>
        </div>
      </div>
    </div>
